[package]
name = "ext-miracast"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Carlos Alberto <psncarlosalberto4ti@gmail.com>"]
description = "Autonomous Pure-Rust Universal Miracast (Wi-Fi Display / WFD 1.0 / MS-MICE) Client"
readme = "README.md"
repository = "https://github.com/programandosolucoes/ext-miracast"
keywords = ["miracast", "wifi-display", "rtsp", "mpegts", "video-streaming"]

[dependencies]
drm = "0.15.0"
libc = "0.2"
libva = "0.1.4"
moq-nvenc = "0.1.0"
openh264 = "0.9.8"
zbus = "5.19.0"

[[bin]]
name = "ext-miracast"
path = "src/main.rs"
